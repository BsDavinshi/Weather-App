<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherMap — Asynchronous Weather &amp; Geolocation SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <h1 class="app-title">WeatherMap Explorer</h1>
      <p class="app-subtitle">Real-Time Asynchronous Geolocation &amp; Meteorological Dashboard</p>
    </div>
  </header>
  <main class="container main-content">
    <section class="controls-panel" aria-label="Location Search Controls">
      <form id="weather-form" class="search-form" novalidate>
        <div class="input-wrapper">
          <label for="location-input" class="sr-only">Enter a city or address</label>
          <input
            type="text"
            id="location-input"
            class="location-input"
            placeholder="Please enter location (e.g., Khartoum, Port Sudan, Cairo)..."
            autocomplete="off"
            required
          >
        </div>
        <div class="form-actions">
          <button type="submit" id="search-btn" class="btn btn-primary">
            Get Weather
          </button>
          <button type="button" id="locate-btn" class="btn btn-secondary" title="Use my current location">
            My Location
          </button>
          <button type="button" id="unit-toggle-btn" class="btn btn-outline" title="Toggle Celsius / Fahrenheit">
            °C
          </button>
        </div>
      </form>
      <div class="favorites-bar">
        <span class="favorites-label">Saved Locations:</span>
        <div id="favorites-list" class="favorites-list"></div>
      </div>
    </section>
    <div id="loading-indicator" class="loading-banner hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span id="loading-text">Resolving coordinates and fetching weather data...</span>
    </div>
    <div id="alert-box" class="alert-card hidden" role="alert" aria-live="assertive">
      <div class="alert-content">
        <strong id="alert-title" class="alert-title">Notice</strong>
        <p id="alert-message" class="alert-message"></p>
      </div>
      <button type="button" id="alert-close-btn" class="alert-close" aria-label="Close alert">&times;</button>
    </div>
    <section class="map-section" aria-label="Interactive Weather Map">
      <div id="map" class="map-container"></div>
    </section>
  </main>
  <footer class="app-footer">
    <div class="container footer-inner">
      <span>Sudan University of Science &amp; Technology — Advanced Web Technologies</span>
      <span>Powered by OpenWeatherMap &amp; OpenStreetMap / Leaflet.js</span>
    </div>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
